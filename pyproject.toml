[project]
name = "wsl-files"
version = "0.1.0"
description = "Local stdio MCP server: read and write files under ~/dev in WSL, for an MCP client that cannot reach WSL paths (Claude Cowork)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "duplonicus" }]
requires-python = ">=3.11"
dependencies = [
    # 1.x FastMCP API; the 2.x line moved things around.
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsl_files"]

[tool.pytest.ini_options]
testpaths = ["tests"]
